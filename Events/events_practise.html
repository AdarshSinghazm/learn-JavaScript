<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Events Practice</title>
</head>
<body style="background-color: #414141; color: wheat;">
    <ul id="avengers">
        <li><img width="550" height="280" id="thor" src="https://thumbs.dreamstime.com/b/close-up-shot-thor-avengers-superheros-figure-action-fighting-bangkok-thailand-december-appearing-american-comic-books-134205604.jpg" alt="thorImage"></li>
        <li><img width="550" height="280" id="ironMan" src="https://wallpapers.com/images/high/iron-man-hd-wallpaper-and-background-image-9b07nm2i6a4ua8sw.jpg" alt="ironManImage"></li>
        <li><img width="550" height="280" id="spiderMan" src="https://wallpaperaccess.com/full/3573930.jpg" alt="spiderManImage"></li>
        <li><img width="550" height="280" id="loki" src="https://i.pinimg.com/originals/ed/a8/5c/eda85ca52db662d206fd2a4eb6a4f92f.jpg" alt="lokiImage"></li>
        <li><a href="https://www.google.com" id="google">google</a></li>
    </ul>

    <p>Hold Alt / Ctrl / Shift and click any image to see modifier keys logged in the console.</p>
</body>
<script>
    // ===== BASIC BUBBLING DEMO =====
    document.getElementById('spiderMan').addEventListener('click', function (e) {
        console.log("SpiderMan arrived");
    });

    document.getElementById('avengers').addEventListener('click', function (e) {
        console.log('Avengers Assemble');
    });
    // No 3rd argument on either listener -> both default to bubbling (false)
    // Click Spider-Man -> "SpiderMan arrived" logs first, then "Avengers Assemble" (bubbles up)

    // ===== stopPropagation() DEMO =====
    document.getElementById('loki').addEventListener('click', function (e) {
        e.stopPropagation();
        console.log("Loki click stopped here");
    });
    // Click Loki -> only "Loki click stopped here" logs
    // stopPropagation() blocks the event from bubbling up to ul#avengers

    // ===== preventDefault() + stopPropagation() DEMO =====
    document.getElementById('google').addEventListener('click', function (e) {
        e.preventDefault();   // stops navigation to google.com
        e.stopPropagation();  // stops bubbling up to ul#avengers
        console.log('Google Clicked - navigation prevented');
    });

    // ===== EVENT OBJECT PROPERTIES DEMO =====
    // Attached to thor and ironMan so you can inspect the event object's properties
    function logEventDetails(e) {
        console.log("---- Event Details ----");
        console.log("type:", e.type);
        console.log("timeStamp:", e.timeStamp);
        console.log("defaultPrevented:", e.defaultPrevented);
        console.log("target:", e.target);
        console.log("currentTarget:", e.currentTarget);
        console.log("clientX, clientY:", e.clientX, e.clientY);
        console.log("screenX, screenY:", e.screenX, e.screenY);
        console.log("altKey:", e.altKey);
        console.log("ctrlKey:", e.ctrlKey);
        console.log("shiftKey:", e.shiftKey);
        // Legacy/IE-only properties - won't exist in modern browsers, will log undefined
        console.log("toElement (legacy, IE-only):", e.toElement);
        console.log("srcElement (legacy, old IE alias for target):", e.srcElement);
    }

    document.getElementById('thor').addEventListener('click', logEventDetails);
    document.getElementById('ironMan').addEventListener('click', logEventDetails);

    // ===== keyCode DEMO (deprecated, but common interview question) =====
    document.addEventListener('keydown', function (e) {
        console.log("---- Keydown Event ----");
        console.log("keyCode (deprecated):", e.keyCode);
        console.log("key (modern replacement):", e.key);
        console.log("code (modern replacement):", e.code);
    });
</script>
</html>
