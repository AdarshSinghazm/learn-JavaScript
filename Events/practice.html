<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
 <style>
    .container{
        margin-top: 60px;
        width: 60vw;
        height: fit-content;
        border: 2px solid black;
        margin: auto;
        text-align: center;
    }
    li{
        border: 2px solid black;
        background-color: black;
        color:white;
        display: flex;
        justify-content: space-around;
    }
    span.done{
        text-decoration: line-through;
    }
    .charCount{
        border: 2px solid black;
        font-size: 10px;
        width:fit-content;
        margin-left: 158px;
    }
    .maxChar{
        color: red;
    }
 </style>
<body>
    
    <label for="todoInput" >Add work : </label>
    <input type="text" id="todoInput" placeholder="Add a todo work">
    <div class="charCount">0/50 charcaters</div>
    <button class="add">Add</button>


    <div class="container">
        <p>Here is your todo List</p>
        <ul id="todoList">
          
        </ul>
    </div>

</body>

<script>
    const add = document.querySelector('.add')
    const inputFeild = document.querySelector('#todoInput')
    const ul = document.querySelector('ul')
    const charCount = document.querySelector('.charCount')
    

    add.addEventListener('click',function(e){
        const li = document.createElement('li')
        const txt = document.createElement('span')
        txt.innerHTML=inputFeild.value
        const btn = document.createElement('button')
        const completeBtn = document.createElement('button')
        completeBtn.classList.add('completeBtn')
        btn.classList.add('delete')
        
        btn.innerHTML='Delete'
        completeBtn.innerHTML='Complete'
        ul.appendChild(li)
        li.appendChild(txt)
        li.appendChild(btn)
        li.appendChild(completeBtn)
    })

   ul.addEventListener('click',function(e){
      if(e.target.classList.contains('delete')){
        e.target.closest('li').remove()
      }
      if(e.target.classList.contains('completeBtn')){
        const span = e.target.closest('li').querySelector('span')
        span.classList.toggle('done')
        e.target.innerHTML = span.classList.contains('done') ? 'Undo' : 'Complete'
      }
   })
   
   inputFeild.addEventListener('input',function(e){
    let len =e.target.value.length;
    charCount.innerHTML=`${len}/50 charcaters`
    charCount.classList.toggle('maxChar',len>50)
   })


</script>
</html>
