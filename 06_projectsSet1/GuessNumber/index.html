<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">Number Guessing Game</div>
    <p class="subheading">Try and guess a random number between 1 and 100</p>
    <p class="subheading">
        You have 10 attempts to guess the right number
    </p>

    <form>
        <label for="guessFeild">Guess a Number</label>
        <input type="text" id="guessField" class="guessField">
        <input type="submit" id="sbt" class="guessSubmit">
    </form>

    <div class="result">
        <p>Previous Guesses ->  <span id="prevGuesses"></span> </p>
        <p>guessRemaining -> <span id="guessRemaining">10</span> </p>
        <p >Result-><span class="message"></span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
