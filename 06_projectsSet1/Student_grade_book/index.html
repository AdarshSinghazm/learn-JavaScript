<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student grade book</title>
    <style>
      /* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ===== BASE ===== */
body {
    background: #121212;
    color: white;
    font-family: sans-serif;
    padding: 2rem;
}

/* ===== TYPOGRAPHY ===== */
h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 4px;
}

.sub {
    font-size: 14px;
    color: #888;
    margin-bottom: 1rem;
}

/* ===== COUNTER ===== */
.counter {
    font-size: 13px;
    color: #888;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 4px 12px;
    display: inline-block;
    margin-bottom: 1.5rem;
}

/* ===== FORM ===== */
form {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 420px;
    margin-bottom: 2rem;
}

form label {
    font-size: 13px;
    color: #888;
    display: block;
    margin-bottom: 2px;
}

form input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #2a2a2a;
    color: white;
    font-size: 14px;
}

form input:focus {
    outline: none;
    border-color: #555;
}

form button {
    padding: 8px 16px;
    border: 1px solid #444;
    border-radius: 8px;
    background: transparent;
    color: white;
    font-size: 14px;
    cursor: pointer;
    align-self: flex-start;
    margin-top: 4px;
}

form button:hover {
    background: #2a2a2a;
}

/* ===== CARDS ===== */
#cardContainer {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.card {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 12px;
}

.card.grade-a { border-left: 3px solid #1D9E75; }
.card.grade-f { border-left: 3px solid #E24B4A; }

/* ===== CARD CONTENT ===== */
.info { flex: 1; }

.name {
    font-size: 15px;
    font-weight: 500;
}

.meta {
    font-size: 13px;
    color: #888;
    margin-top: 2px;
}

/* ===== BADGES ===== */
.badge {
    font-size: 12px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 8px;
}

.badge-a        { background: #0a2e1f; color: #1D9E75; }
.badge-b        { background: #0a1e33; color: #378ADD; }
.badge-c        { background: #2e1f0a; color: #EF9F27; }
.badge-d        { background: #2e0a1f; color: #D4537E; }
.badge-f        { background: #2e0a0a; color: #E24B4A; }
.badge-promoted { background: #0a2e1f; color: #1D9E75; }

/* ===== BUTTONS ===== */
.actions {
    display: flex;
    gap: 8px;
}

.btn {
    font-size: 13px;
    padding: 5px 12px;
    border: 1px solid #444;
    border-radius: 8px;
    background: transparent;
    color: #888;
    cursor: pointer;
}

.btn:hover { background: #2a2a2a; }
.btn.danger:hover { color: #E24B4A; border-color: #E24B4A; }
   </style>
</head>

<body>
    <h1>Student grade book</h1>
    <form>
        <label for="name">Name: </label>
        <input type="text" placeholder="Enter Your Name" id="name">

        <label for="subject">Subject Name: </label>
        <input type="text" placeholder="Enter Subject Name" id="subject">

        <label for="marks">Marks: </label>
        <input type="number" placeholder="Enter marks" id="marks">

        <button onclick='return addDetails()'>Add details</button>
    </form>
    <div class="cardContainer">

    </div>
    <script src="script.js"></script>
</body>
</html>
