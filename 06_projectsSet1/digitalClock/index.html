<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
</head>
<style>
    body{
        background-color: rgb(232, 167, 3);
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .clock{
        width: 200px;
        height: 100px;
        color: white;
    }
    .clock .clockName{
        font-family: sans-serif;
        font-weight: 600;
        margin-bottom: 10px;
        margin-left: 45px;
    }
    .box{
        background: rebeccapurple;
        width: 100%;
        height: 40%;
        margin: auto;
        border-radius: 5px;
        text-align: center;
    }

</style>
<body>
    <div class="clock">
        <div class="clockName">Digital Clock</div>
        <div class="box"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
