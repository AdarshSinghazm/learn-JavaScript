<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="unorder">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    function addLang(langname){
    const li = document.createElement('li')
    li.innerHTML=langname
    document.querySelector('.unorder').appendChild(li)
    }
    addLang("python")
    addLang("css")

    function addOptimallyLang(langname){
    const li = document.createElement('li')
    const text = document.createTextNode(langname)
    li.appendChild(text)
    document.querySelector('.unorder').appendChild(li)
    }
    addOptimallyLang("React")

    
    //edit 
    const secLang=document.querySelector("li:nth-child(2)")
    console.log(secLang);
    const li = document.createElement('li')
    const text = document.createTextNode("golang")
    li.appendChild(text)
    secLang.replaceWith(li)

    // remove
    const firstLang = document.querySelector('li:first-child')
    firstLang.remove()
    
</script>
</html>
